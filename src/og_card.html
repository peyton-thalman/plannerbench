<!doctype html>
<!-- The link-preview card (what iMessage, Teams, Slack and LinkedIn show for a plannerbench.org link).
     Words are the home page's own: title, the line under it, the byline. Render it to web/og.png with:
     "$CHROME" --headless=new --hide-scrollbars --window-size=1200,630 --force-device-scale-factor=2 \
       --virtual-time-budget=5000 --screenshot=web/og.png src/og_card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400..500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 88px 60px; background: #ffffff; color: #16181c;
         display: flex; flex-direction: column; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { margin: 44px 0 0; font: 400 148px/1 "Newsreader", Georgia, serif; letter-spacing: -0.02em; }
  p { margin: 36px 0 0; font: 500 40px/1.3 "Geist", system-ui, sans-serif; color: #4d525b; max-width: 20em; }
  footer { margin-top: auto; padding-top: 26px; border-top: 1px solid rgba(22, 24, 28, 0.2); display: flex; justify-content: space-between; align-items: baseline;
           font: 500 24px/1.4 "Geist Mono", ui-monospace, monospace; color: #4d525b; letter-spacing: 0.02em; }
  footer b { font-weight: 500; color: #16181c; }
  footer span { font: 400 23px/1.4 "Geist", system-ui, sans-serif; letter-spacing: 0; white-space: nowrap; }
</style>
</head>
<body>
  <h1>PlannerBench</h1>
  <p>Can AI answer retirement questions correctly? I tested it.</p>
  <footer><b>plannerbench.org</b><span>Peyton Thalman, financial advisor in Sun City West, Arizona</span></footer>
</body>
</html>
