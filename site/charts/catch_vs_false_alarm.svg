<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Catch rate against false-alarm rate on the bad-inputs track, one dot per model" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"><rect width="760" height="500" fill="#ffffff"/><text x="64.0" y="22.0" font-size="15" fill="#16181c" text-anchor="start" font-weight="600">Bad inputs: caught the planted problem vs. cried wolf on a clean note</text><text x="64.0" y="40.0" font-size="12" fill="#4d525b" text-anchor="start" font-weight="400">Each dot is one model. Up and to the left is better.</text><line x1="64" x2="610" y1="444.0" y2="444.0" stroke="#e7e8e8"/><text x="54.0" y="448.0" font-size="12" fill="#4d525b" text-anchor="end" font-weight="400">0%</text><line x1="64.0" x2="64.0" y1="56" y2="444" stroke="#e7e8e8"/><text x="64.0" y="464.0" font-size="12" fill="#4d525b" text-anchor="middle" font-weight="400">0%</text><line x1="64" x2="610" y1="347.0" y2="347.0" stroke="#e7e8e8"/><text x="54.0" y="351.0" font-size="12" fill="#4d525b" text-anchor="end" font-weight="400">25%</text><line x1="200.5" x2="200.5" y1="56" y2="444" stroke="#e7e8e8"/><text x="200.5" y="464.0" font-size="12" fill="#4d525b" text-anchor="middle" font-weight="400">25%</text><line x1="64" x2="610" y1="250.0" y2="250.0" stroke="#e7e8e8"/><text x="54.0" y="254.0" font-size="12" fill="#4d525b" text-anchor="end" font-weight="400">50%</text><line x1="337.0" x2="337.0" y1="56" y2="444" stroke="#e7e8e8"/><text x="337.0" y="464.0" font-size="12" fill="#4d525b" text-anchor="middle" font-weight="400">50%</text><line x1="64" x2="610" y1="153.0" y2="153.0" stroke="#e7e8e8"/><text x="54.0" y="157.0" font-size="12" fill="#4d525b" text-anchor="end" font-weight="400">75%</text><line x1="473.5" x2="473.5" y1="56" y2="444" stroke="#e7e8e8"/><text x="473.5" y="464.0" font-size="12" fill="#4d525b" text-anchor="middle" font-weight="400">75%</text><line x1="64" x2="610" y1="56.0" y2="56.0" stroke="#e7e8e8"/><text x="54.0" y="60.0" font-size="12" fill="#4d525b" text-anchor="end" font-weight="400">100%</text><line x1="610.0" x2="610.0" y1="56" y2="444" stroke="#e7e8e8"/><text x="610.0" y="464.0" font-size="12" fill="#4d525b" text-anchor="middle" font-weight="400">100%</text><text x="337.0" y="490.0" font-size="12" fill="#4d525b" text-anchor="middle" font-weight="400">False alarms: said NEED_INFO on a clean or odd-but-valid note</text><text transform="translate(16 250) rotate(-90)" font-size="12" fill="#4d525b" text-anchor="middle">Caught: named the problem and gave no number</text><circle cx="337.0" cy="88.3" r="7" fill="#c2571a" stroke="#ffffff" stroke-width="2"><title>Gemini 3.8 Flash: caught 92%, false alarms 50%</title></circle><text x="349.0" y="92.3" font-size="12" fill="#16181c" text-anchor="start" font-weight="400">Gemini 3.8 Flash</text><circle cx="64.0" cy="159.5" r="7" fill="#1f8a6b" stroke="#ffffff" stroke-width="2"><title>Claude Sonnet 5.5: caught 73%, false alarms 0%</title></circle><text x="89.7" y="163.5" font-size="12" fill="#16181c" text-anchor="start" font-weight="400">Claude Sonnet 5.5</text><circle cx="77.7" cy="159.5" r="7" fill="#1f8a6b" stroke="#ffffff" stroke-width="2"><title>GPT-6.1 Sol: caught 73%, false alarms 2%</title></circle><text x="89.7" y="177.5" font-size="12" fill="#16181c" text-anchor="start" font-weight="400">GPT-6.1 Sol</text><circle cx="432.6" cy="172.4" r="7" fill="#1f8a6b" stroke="#ffffff" stroke-width="2"><title>Gemini 3.1 Pro: caught 70%, false alarms 68%</title></circle><text x="444.6" y="176.4" font-size="12" fill="#16181c" text-anchor="start" font-weight="400">Gemini 3.1 Pro</text><circle cx="64.0" cy="191.8" r="7" fill="#c2571a" stroke="#ffffff" stroke-width="2"><title>Claude Haiku 5.5: caught 65%, false alarms 0%</title></circle><text x="89.7" y="195.8" font-size="12" fill="#16181c" text-anchor="start" font-weight="400">Claude Haiku 5.5</text><circle cx="77.7" cy="204.7" r="7" fill="#c2571a" stroke=